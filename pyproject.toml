[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traksha"
version = "0.1.0"
description = "Physics-anchored monocular elevation: single RGB image to metric DSM"
requires-python = ">=3.10"
# Source-available, not OSI open source: Apache-2.0 with the Commons Clause
# restriction. See LICENSE. Deliberately not the bare "Apache-2.0" SPDX id,
# which would misstate the grant.
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "rasterio>=1.3.9",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "sse-starlette>=2.0"]
# Quadric edge collapse for the browser copy of the structural mesh.
# Optional: without it the mesh is built on a strided grid instead,
# which is measurably worse (README section 6.3) but still works.
mesh = ["pymeshlab>=2023.12", "trimesh>=4.0"]
# The training-free appearance refiner (README section 6.2g). TRELLIS.2 itself
# is not on PyPI - it is a git checkout with CUDA extensions built from source -
# so what is declared here is only what this side of the handover needs.
refiner = ["trimesh>=4.0", "pillow>=10.0", "huggingface_hub>=0.23"]
# Bare earth by multi-scale drape-cloth filter (CNES Bulldozer). CPU-only,
# Apache-2.0, and worth 6.195 m -> 0.811 m of DTM MAE on the bundled fixture -
# see README section 6.2a. Optional because it is a compiled dependency;
# `dsm.dtm` falls back to the morphological filter and records that it did.
terrain = ["bulldozer-dtm>=1.3", "scikit-image>=0.22"]
# Sub-pixel contour tracing and Douglas-Peucker for footprint regularisation
# (README section 6.2d). scikit-image also arrives with `terrain`; listed here
# too so either extra alone is sufficient.
geometry = ["scikit-image>=0.22"]
dev = ["pytest>=8.0"]

[project.scripts]
traksha = "traksha.cli:main"

[tool.setuptools.packages.find]
include = ["traksha*"]

# The bundled sample scene: a real lidar crop of central Zurich (about 2.5 MB).
# It has to travel with the package, because `traksha preflight` and `traksha
# sample` both run on it and neither should need a 350 MB download to work on a
# fresh install. See traksha/data/sample.py and the swisstopo licence in
# traksha/data/fixture/ATTRIBUTION.md.
[tool.setuptools.package-data]
"traksha.data" = ["fixture/*.tif", "fixture/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
markers = [
    "gpu: requires a working CUDA device",
    "slow: loads real model weights",
]
