[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayama"
version = "0.1.0"
description = "Physics-anchored monocular elevation: single RGB image to metric DSM"
requires-python = ">=3.10"
# Source-available, not OSI open source: Apache-2.0 with the Commons Clause
# restriction. See LICENSE. Deliberately not the bare "Apache-2.0" SPDX id,
# which would misstate the grant.
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "rasterio>=1.3.9",
]

[project.optional-dependencies]
torch = ["torch>=2.2", "torchvision>=0.17", "transformers>=4.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "sse-starlette>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
ayama = "ayama.cli:main"

[tool.setuptools.packages.find]
include = ["ayama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::rasterio.errors.NotGeoreferencedWarning"]
markers = [
    "gpu: requires a working CUDA device",
    "slow: loads real model weights",
]
