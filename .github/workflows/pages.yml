# Publish the site to GitHub Pages.
#
# The front end is a Vite + React app, so there IS a build step: what deploys is
# web/dist, not web/. Copying the sources would publish a `<script type="module"
# src="/src/main.jsx">` no browser can execute, and the page would come up blank
# with nothing in the log to say why.
#
# Pages has no backend, so /api/health 404s there. That is the signal the app
# uses to fall back to the tileset committed at web/data: the published site
# cannot reconstruct an upload, but its 3D is real.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the front end
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          # One web root: index.html is the app (upload -> reconstruct -> 3D)
          # and results.html is the study dashboard, both emitted by the build.
          cp -r web/dist/. _site/
          # The demo tileset is committed, not built, so it is copied in beside
          # the bundle. It is what the published site draws when no service
          # answers, which on Pages is always.
          cp -r web/data _site/data
          test -f _site/results.html
          test -f _site/data/tileset.json
          if [ -d results ]; then
            mkdir -p _site/results
            # Only what the page reads: each arm's dataset.json and the
            # per-scene quick-look images. Matched by extension rather than by
            # directory, because an rsync pattern containing a slash is anchored
            # at the transfer root, so 'zurich/**' would never match
            # 'real_vitl_h1/zurich/ndsm.png' and the explorer would ship with no
            # images at all.
            ( cd results && find . -type f \
                \( -name '*.json' -o -name '*.md' -o -name '*.png' \
                   -o -name '*.jpg' -o -name '*.pdf' -o -name '*.tex' \) \
                -exec install -D {} ../_site/results/{} \; )
          fi
          test -f _site/index.html
          echo "published: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"
          find _site -type f | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
