# Publish the results site to GitHub Pages.
#
# The site is static and needs no build step: it is a renderer for
# results/dataset.json, so republishing after a new run is just a commit.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # One web root: index.html is the app (upload -> reconstruct -> 3D)
          # and results.html is the study dashboard. web/ is self-contained -
          # its committed tileset lives in web/data - so the 3D loads with no
          # build step and no external request.
          rm -rf _site/node_modules _site/dist
          test -f _site/results.html
          test -f _site/data/tileset.json
          if [ -d results ]; then
            mkdir -p _site/results
            # Only what the page reads: each arm's dataset.json and the
            # per-scene quick-look images. Matched by extension rather than by
            # directory, because an rsync pattern containing a slash is anchored
            # at the transfer root, so 'zurich/**' would never match
            # 'real_vitl_h1/zurich/ndsm.png' and the explorer would ship with no
            # images at all.
            ( cd results && find . -type f \
                \( -name '*.json' -o -name '*.md' -o -name '*.png' \
                   -o -name '*.jpg' -o -name '*.pdf' -o -name '*.tex' \) \
                -exec install -D {} ../_site/results/{} \; )
          fi
          test -f _site/index.html
          echo "published: $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"
          find _site -type f | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
