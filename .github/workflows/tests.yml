# The suite that does not need a GPU. GPU-marked tests skip here with a reason,
# which is the point: the same suite runs on a laptop, in CI and on the GPU box.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check unnat tests --select F,E9

      - name: Test
        run: pytest tests -q -rs

      - name: Pipeline smoke test, no weights
        run: |
          python -m unnat.cli synth --out /tmp/s.tif --size 384
          python -m unnat.cli info /tmp/s.tif
          python -m unnat.cli run /tmp/s.tif --out /tmp/run --backbone synthetic \
              --chip 256 --dem sim:/tmp/s_dtm.tif --ref /tmp/s_dsm.tif --bootstrap 4
