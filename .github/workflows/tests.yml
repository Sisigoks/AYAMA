# The whole suite. TRAKSHA is CPU-only, so what runs here is what runs anywhere -
# there is no second, unrun configuration to drift out of sync.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check traksha tests --select F,E9

      - name: Test
        run: pytest tests -q -rs

      # The bundled sample is a real lidar crop of central Zurich shipped inside
      # the package, so this needs no download. There is no weightless backbone
      # any more - a placeholder that fabricates depth is how an invented number
      # reaches a results table - so the smallest real model runs instead.
      - name: Pipeline smoke test on the bundled real scene
        run: |
          python -m traksha.cli sample --out /tmp/s.tif --size 384
          python -m traksha.cli info /tmp/s.tif
          python -m traksha.cli run /tmp/s.tif --out /tmp/run --backbone dav2-vits \
              --chip 256 --dem sim:/tmp/s_dtm.tif --ref /tmp/s_dsm.tif --bootstrap 4

      # Phase 3 and 4. The tileset is built from the run above rather than from a
      # fixture, so CI exercises the same path a user does, and the viewer is then
      # executed headlessly against that manifest - the only check that catches
      # web/app.js and traksha/mesh/encode.py drifting apart on the encoding.
      - name: Phase 3 tileset
        run: |
          python -m traksha.cli mesh /tmp/run --out /tmp/tiles3d --progress plain
          test -f /tmp/tiles3d/tileset.json
          test -f /tmp/tiles3d/mesh/surface.obj

      - name: Phase 4 viewer, headless
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node scripts/check_app.js /tmp/tiles3d
