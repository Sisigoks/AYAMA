# The suite that does not need a GPU. GPU-marked tests skip here with a reason,
# which is the point: the same suite runs on a laptop, in CI and on the GPU box.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check ayama tests --select F,E9

      - name: Test
        run: pytest tests -q -rs

      - name: Pipeline smoke test, no weights
        run: |
          python -m ayama.cli synth --out /tmp/s.tif --size 384
          python -m ayama.cli info /tmp/s.tif
          python -m ayama.cli run /tmp/s.tif --out /tmp/run --backbone synthetic \
              --chip 256 --dem sim:/tmp/s_dtm.tif --ref /tmp/s_dsm.tif --bootstrap 4

      # Phase 3 and 4. The tileset is built from the run above rather than from a
      # fixture, so CI exercises the same path a user does, and the viewer is then
      # executed headlessly against that manifest - the only check that catches
      # web/app.js and ayama/mesh/encode.py drifting apart on the encoding.
      - name: Phase 3 tileset
        run: |
          python -m ayama.cli mesh /tmp/run --out /tmp/tiles3d --progress plain
          test -f /tmp/tiles3d/tileset.json
          test -f /tmp/tiles3d/mesh/surface.obj

      - name: Phase 4 viewer, headless
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node scripts/check_app.js /tmp/tiles3d
